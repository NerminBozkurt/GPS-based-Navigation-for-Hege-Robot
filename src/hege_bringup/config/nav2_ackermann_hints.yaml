# Ackermann-specific sections to merge into the real Nav2 parameter file.
# This is intentionally not a complete Nav2 configuration: GPS/Pixhawk
# localization, map/odom TF, rolling costmaps and the measured vehicle
# footprint belong to the final robot setup. HEGE has no obstacle sensors.

planner_server:
  ros__parameters:
    planner_plugins: [GridBased]

    GridBased:
      # Hybrid-A* plans continuous car-like paths. DUBIN is forward-only,
      # matching the bridge, which currently rejects reverse commands.
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      motion_model_for_search: "DUBIN"

      # L/tan(delta_max) = 1.90/tan(35 deg) = 2.71 m physically.
      # The first-test yaw cap is 0.10 rad/s at 0.30 m/s, so use the safer
      # operational radius v/omega = 3.0 m until controller tracking is proven.
      minimum_turning_radius: 3.0
      angle_quantization_bins: 72

      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0

      analytic_expansion_ratio: 3.5
      # Nav2 recommends at least 4-5 times minimum_turning_radius.
      analytic_expansion_max_length: 15.0
      cost_penalty: 2.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      smooth_path: true

controller_server:
  ros__parameters:
    controller_plugins: [FollowPath]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Must agree with bridge_real.yaml max_speed.
      desired_linear_vel: 0.3
      min_approach_linear_velocity: 0.1

      # A car cannot rotate in place. Reverse is disabled in the bridge.
      use_rotate_to_heading: false
      allow_reversing: false

      use_regulated_linear_velocity_scaling: true
      # This is the radius at which RPP starts slowing down, not a hard
      # kinematic constraint. The hard constraint is in the planner above.
      regulated_linear_scaling_min_radius: 3.0
      regulated_linear_scaling_min_speed: 0.15

      # GPS-only open-field operation: there is no LiDAR/radar/depth sensor
      # supplying obstacle costs. Do not pretend that collision checking or
      # cost-based speed regulation can see physical obstacles.
      use_collision_detection: false
      use_cost_regulated_linear_velocity_scaling: false

      lookahead_dist: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 2.0
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

# Before autonomous motion, also do these in the complete Nav2 configuration:
# - use the measured polygon footprint (not a small robot_radius);
# - use GPS/Pixhawk localization and rolling costmaps without obstacle_layer
#   or voxel_layer plugins;
# - remove Spin and BackUp recoveries while reverse remains disabled;
# - remap controller output to /cmd_vel/nav;
# - define map -> odom -> base_link TF ownership exactly once.
# With no obstacle sensors, the vehicle cannot detect or avoid people, boxes,
# bushes or other vehicles. Operate only in a cleared, controlled area.
