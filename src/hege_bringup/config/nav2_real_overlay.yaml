# Nav2 parameters for the REAL Hege, layered over nav2_params.yaml.
#
# Two separate reasons this file exists.
#
# 1. PX4 cannot reverse in offboard. Its offboard velocity branch drives
#    forwards only and hege_px4_bridge turns any negative linear.x into a full
#    stop, so a Reeds-Shepp path is one the vehicle silently refuses to finish.
#
# 2. bridge_real.yaml caps the vehicle at 0.3 m/s for first tests, and
#    nav2_params.yaml is tuned for 1.0. The bridge clamps without telling
#    anyone, so the controller would be tracking against a speed it is not
#    getting.
#
# This file is deliberately self-contained rather than layering on
# nav2_px4_overlay.yaml, because navigation.launch.py takes one overlay. The
# three forward-only keys are repeated here on purpose.
#
# EVERY SPEED NUMBER BELOW IS A STARTING POINT, NOT A MEASUREMENT. The figures
# in nav2_params.yaml were measured by driving the simulated rover and reading
# what it did. Nothing here has been measured on the real vehicle at 0.3 m/s.
# Expect to change them after the first runs, and see docs/real_vehicle.md for
# what to measure.

planner_server:
  ros__parameters:
    GridBased:
      # Forward-only, for reason 1 above.
      motion_model_for_search: DUBIN
      reverse_penalty: 1.0

      # Unchanged from nav2_params.yaml at 6.0 m, and it is the binding
      # constraint: the bridge's 0.10 rad/s yaw cap at 0.3 m/s corresponds to
      # an operational radius of 0.3/0.10 = 3.0 m, so the planner is the
      # tighter of the two and never reaches the clamp. Leave it there until
      # the achievable radius has been measured on the real machine.
      minimum_turning_radius: 6.0

controller_server:
  ros__parameters:
    FollowPath:
      allow_reversing: false

      # = max_speed in bridge_real.yaml. These two must move together: raising
      # one without the other means the bridge quietly clamps and the
      # controller never learns why the rover is slower than it asked for.
      desired_linear_vel: 0.3

      # Below desired_linear_vel, and above the bridge's min_moving_speed of
      # 0.05 - anything under that becomes a full stop rather than a crawl, so
      # an approach velocity below it would stall the rover just short of the
      # goal.
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 2.0

      # Also below desired_linear_vel, for the same reason. It was 0.4 in
      # nav2_params.yaml, which is above the cap - the rover would be asked to
      # slow down to a speed faster than its limit.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 8.0
      regulated_linear_scaling_min_speed: 0.15

      # At 0.3 m/s the velocity-scaled lookahead computes 0.3 * 2.0 = 0.6 m and
      # is then clamped to min_lookahead_dist, so in practice the lookahead is
      # fixed at 2.0 m - about one vehicle length ahead. That is deliberate:
      # shortening it further makes a 1.90 m wheelbase oscillate, and
      # lengthening it makes pure pursuit cut corners.
      lookahead_dist: 2.0
      min_lookahead_dist: 2.0
      max_lookahead_dist: 4.0
      lookahead_time: 2.0

behavior_server:
  ros__parameters:
    # backup dropped: the vehicle cannot execute it through the bridge, and a
    # recovery that is commanded and silently ignored looks exactly like a hung
    # navigator.
    behavior_plugins: [drive_on_heading, wait]

velocity_smoother:
  ros__parameters:
    # 1300 kg. nav2_params.yaml allows 1.0 m/s^2, which at a 0.3 m/s ceiling
    # would go from standstill to full speed in a third of a second. The PX4
    # airframe's own RO_ACCEL_LIM is 0.5, so anything above that is a request
    # PX4 will not honour anyway.
    max_accel: [0.3, 0.0, 0.5]
    max_decel: [-0.5, 0.0, -0.5]
    max_velocity: [0.3, 0.0, 0.35]
