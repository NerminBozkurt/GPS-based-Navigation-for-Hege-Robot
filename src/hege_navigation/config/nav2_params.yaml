amcl:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /ackermann_steering_controller/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    default_nav_through_poses_bt_xml: "/workspace/install/hege_navigation/share/hege_navigation/config/no_replan_bt.xml"
    default_nav_to_pose_bt_xml: "/workspace/install/hege_navigation/share/hege_navigation/config/no_replan_bt_to_pose.xml"
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.5           # Płynna, realistyczna prędkość robocza traktora (~5.4 km/h)
      lookahead_dist: 3.2               # Płynne podążanie za wyznaczoną ścieżką
      min_lookahead_dist: 2.2           # Klucz: ZAWSZE większy od rozstawu osi (1.91m) - brak drgań kół
      max_lookahead_dist: 5.0
      lookahead_time: 1.8
      rotate_to_heading_angular_vel: 0.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.6
      approach_velocity_scaling_dist: 2.0
      use_collision_detection: false
      allow_reversing: true             # Zezwolenie na cofanie, gdy planner tego wymaga
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_velocity_scaling_min_radius: 4.0
      regulated_linear_velocity_scaling_min_speed: 0.8  # Płynne zwolnienie na łuku, aby uniknąć uślizgu kół
      use_rotate_to_heading: false      # Brak obrotu w miejscu dla Ackermanna

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5            # Precyzyjny najazd na belę przed zmianą punktu (50 cm)
      yaw_goal_tolerance: 6.28          # Kąt jest w 100% wymuszony prostoliniowym korytarzem najazdu

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: True
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 100000
      max_planning_time: 5.0
      minimum_turning_radius: 2.6       # Pełny fizyczny zasięg skrętu traktora (koła 0.6 rad / 34.4 deg)
      motion_model_for_search: "REEDS_SHEPP"  # REEDS_SHEPP: pozwala na cofanie w sytuacjach awaryjnych
      reverse_penalty: 50.0             # Ekstremalna kara: jazda w tył jest 50x droższa, zmusza do jazdy w przód ze skręconymi kołami
      change_penalty: 10.0              # Duża kara za zmianę kierunku (przód/tył)
      non_straight_penalty: 1.2         # Lekka kara za skręcanie (faworyzuje jazdę na wprost)
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      smooth_path: false                 # Czyste linie i idealne łuki nawrotów

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 15
      height: 15
      resolution: 0.1
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: ""
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.5

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: True
      width: 200
      height: 200
      resolution: 0.2
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: ""
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: False
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 1.2]
    min_velocity: [-1.0, 0.0, -1.2]    # Zezwolenie na prędkość wsteczną do -1.0 m/s
    max_accel: [2.0, 0.0, 1.2]
    max_decel: [-2.0, 0.0, -1.2]

